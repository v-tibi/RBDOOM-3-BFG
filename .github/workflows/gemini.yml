name: Arch Linux Optimized Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Update System and Install Build Dependencies
        run: |
          # Added 'directx-shader-compiler' to provide the required DXC binary
          pacman -Syu --noconfirm
          pacman -S --noconfirm git cmake clang ninja ispc sdl2 openal ffmpeg vulkan-headers directx-shader-compiler

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          
          cmake ../neo \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang \
            -DCMAKE_C_FLAGS="-march=skylake -O3" \
            -DCMAKE_CXX_FLAGS="-march=skylake -O3" \
            -DVULKAN=ON \
            -DFFMPEG=ON \
            -DBINKDEC=OFF \
            -DOPENAL=ON \
            -DCMAKE_INSTALL_PREFIX=../dist

      - name: Build and Install Target
        run: |
          cd build
          ninja
          ninja install

      - name: Package Engine Assets & Directory Structure
        run: |
          # Create a structured deployment folder mimicking the game directory setup
          mkdir -p RBDOOM3-Arch-Skylake/base
          
          # Copy the compiled binaries and engine configuration/generated files
          if [ -d "dist" ]; then
            cp -r dist/* RBDOOM3-Arch-Skylake/
          else
            # Fallback if prefix installation didn't match project structure exactly
            find build/ -maxdepth 1 -type f -executable -exec cp {} RBDOOM3-Arch-Skylake/ \;
          fi
          
          # Include crucial run-from-source directories if they exist in repo root
          if [ -d "base/renderprogs" ]; then cp -r base/renderprogs RBDOOM3-Arch-Skylake/base/; fi
          if [ -d "base/renderprogs2" ]; then cp -r base/renderprogs2 RBDOOM3-Arch-Skylake/base/; fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RBDOOM3-Arch-Skylake
          path: RBDOOM3-Arch-Skylake/
          if-no-files-found: error

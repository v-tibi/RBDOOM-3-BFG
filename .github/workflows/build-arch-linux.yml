name: Build RBDOOM-3-BFG for Arch Linux x86_64

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-arch:
    name: Build (Arch Linux x86_64)
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    env:
      BUILD_TYPE: Release
    steps:
      - name: Update pacman keys and system
        run: |
          set -eux
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm

      - name: Install build dependencies
        run: |
          set -eux
          pacman -S --noconfirm --needed base-devel cmake git wget unzip sdl2 openal ffmpeg vulkan-icd-loader vulkan-headers \
            libx11 libxrandr libxi libxcursor libxinerama libxss alsa-lib libsndfile zlib ispc

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: (Optional) Download DirectXShaderCompiler (dxc)
        run: |
          set -eux
          DXC_VER="v1.8.2405"
          ASSET="linux_dxc_2024_05_24.x86_64.tar.gz"
          URL="https://github.com/microsoft/DirectXShaderCompiler/releases/download/${DXC_VER}/${ASSET}"
          if wget -q --tries=3 --timeout=30 -O /tmp/dxc.tar.gz "$URL"; then
            mkdir -p /opt/dxc
            tar -C /opt/dxc -xzf /tmp/dxc.tar.gz || true
            if [ -x /opt/dxc/bin/dxc ]; then
              chmod +x /opt/dxc/bin/dxc
              echo "/opt/dxc/bin" >> $GITHUB_PATH
              echo "DXC installed to /opt/dxc/bin"
            else
              echo "dxc not found in /opt/dxc/bin, continuing without dxc"
            fi
          else
            echo "DXC download failed or not available, continuing without dxc"
          fi

      - name: Prepare build (CMake)
        run: |
          set -eux
          cd neo
          chmod +x cmake-linux-release.sh || true
          if ./cmake-linux-release.sh; then
            echo "cmake configuration succeeded using helper script"
          else
            echo "cmake helper failed, trying fallback configuration"
            mkdir -p build
            cd build
            cmake .. -DCMAKE_BUILD_TYPE=${BUILD_TYPE} -DUSE_VULKAN=ON || cmake .. -DCMAKE_BUILD_TYPE=${BUILD_TYPE} -DUSE_VULKAN=OFF -DFFMPEG=OFF -DBINKDEC=ON
          fi

      - name: Build
        run: |
          set -eux
          if [ -d neo/build ]; then
            cd neo/build
          elif [ -d build ]; then
            cd build
          else
            cd neo || true
          fi
          if [ -f Makefile ]; then
            make -j$(nproc)
          else
            cmake --build . -j$(nproc)
          fi

      - name: Collect binaries and artifacts
        run: |
          set -eux
          mkdir -p release-artifact
          candidates=(
            "neo/build/RBDoom3BFG"
            "neo/build/RBDoom3BFG.x86_64"
            "neo/build/RBDoom3BFG_${BUILD_TYPE}"
            "build/RBDoom3BFG"
            "build/RBDoom3BFG.x86_64"
            "neo/RBDoom3BFG"
            "RBDoom3BFG"
          )
          found=false
          for f in "${candidates[@]}"; do
            if [ -f "$f" ]; then
              cp "$f" release-artifact/
              found=true
              echo "Found binary: $f"
            fi
          done
          if [ "$found" = false ]; then
            echo "Warning: No binaries found in expected locations"
            echo "Searching for any executables..."
            find . -type f -executable -name "*Doom*" -o -name "*BFG*" || true
          fi
          if [ -d neo/build ]; then
            tar -C neo -czf release-artifact/build-tree.tar.gz build || true
          elif [ -d build ]; then
            tar -czf release-artifact/build-tree.tar.gz build || true
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rbd3bfg-linux-x86_64
          path: release-artifact
          retention-days: 7
        if: always()

      - name: Build Summary
        run: |
          echo "## Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Built for Arch Linux x86_64 in ${BUILD_TYPE} mode" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Notes:" >> $GITHUB_STEP_SUMMARY
          echo "- Binary requires the game's 'base/' data directory" >> $GITHUB_STEP_SUMMARY
          echo "- Compatible with x86_64 Arch Linux systems" >> $GITHUB_STEP_SUMMARY
          echo "- Runtime dependencies: SDL2, OpenAL, FFmpeg, Vulkan drivers" >> $GITHUB_STEP_SUMMARY

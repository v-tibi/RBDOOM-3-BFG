name: Build RBDOOM-3-BFG for Linux x86_64
on:
  workflow_dispatch: {}
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
jobs:
  build:
    name: Build (Ubuntu 24.04 / GCC 13)
    runs-on: ubuntu-24.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake git wget \
            gcc-13 g++-13 \
            libsdl2-dev libopenal-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev \
            libvulkan-dev libncurses-dev \
            zlib1g-dev ispc
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 130
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-13 130

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download DirectXShaderCompiler
        run: |
          wget -q https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.8.2405/linux_dxc_2024_05_24.x86_64.tar.gz
          mkdir -p /opt/dxc
          tar -C /opt/dxc -xzf linux_dxc_2024_05_24.x86_64.tar.gz
          chmod +x /opt/dxc/bin/dxc
          echo "/opt/dxc/bin" >> $GITHUB_PATH

      - name: Build
        run: |
          cd neo
          chmod +x cmake-linux-release.sh
          ./cmake-linux-release.sh
          cd ../build
          make -j$(nproc)

      - name: Prepare artifacts
        run: cp build/RBDoom3BFG ./

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rbdoom3bfg-linux-x86_64
          path: |
            .
            !.git
            !.github
            !build
            !neo
